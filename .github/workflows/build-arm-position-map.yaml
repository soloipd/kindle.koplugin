name: Build ARM helper with position map

on:
  workflow_dispatch:
  push:
    branches:
      - goodreads-position-map

permissions:
  contents: read

jobs:
  build-arm-helper:
    # Native ARM64 avoids the extreme ARMv7 compiler slowdown seen on x64/QEMU.
    # setup-qemu still registers ARMv7 compatibility for the container itself.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v4

      - name: Build ARMv7 helper image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.arm
          platforms: linux/arm/v7
          load: true
          tags: kindle-helper-arm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract helper bundle
        run: |
          container_id="$(docker create kindle-helper-arm)"
          docker cp "${container_id}:/build/output" ./kindle-helper-arm
          docker rm "${container_id}"
          tar -C kindle-helper-arm -czf kindle-helper-arm.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: kindle-helper-arm-position-map
          path: kindle-helper-arm.tar.gz
          if-no-files-found: error
          retention-days: 3
