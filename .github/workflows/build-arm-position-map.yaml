name: Build ARM helper with position map

on:
  workflow_dispatch:
  push:
    branches:
      - codex/goodreads-position-map

permissions:
  contents: read

jobs:
  build-arm-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Build ARMv7 helper image
        run: docker build --platform linux/arm/v7 --file .github/Dockerfile.arm --tag kindle-helper-arm .

      - name: Extract helper bundle
        run: |
          container_id="$(docker create kindle-helper-arm)"
          docker cp "${container_id}:/build/output" ./kindle-helper-arm
          docker rm "${container_id}"
          tar -C kindle-helper-arm -czf kindle-helper-arm.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: kindle-helper-arm-position-map
          path: kindle-helper-arm.tar.gz
          if-no-files-found: error
          retention-days: 3
